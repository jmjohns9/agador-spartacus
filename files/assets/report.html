<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Agador Spartacus — Diagnostic Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; color: #1a1a1a; background: white; }
  .page { page-break-after: always; padding: 28px 32px; min-height: 100vh; }
  .page:last-child { page-break-after: auto; }
  h1 { font-size: 22px; font-weight: 800; color: #2188FF; margin-bottom: 6px; letter-spacing: -0.5px; }
  h2 { font-size: 10px; font-weight: 700; color: #2188FF; text-transform: uppercase; letter-spacing: 1.2px; margin: 18px 0 8px; border-bottom: 1.5px solid #2188FF; padding-bottom: 3px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th { background: #f5f5f5; text-align: left; padding: 4px 8px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; color: #666; font-weight: 700; }
  td { padding: 5px 8px; border-bottom: 1px solid #eee; font-size: 11px; }
  .mono { font-family: 'Courier New', monospace; }
  .ok   { color: #00A152; font-weight: 600; }
  .warn { color: #E65100; font-weight: 600; }
  .crit { color: #BF360C; font-weight: 600; }
  .meta-grid { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 16px; }
  .meta-item label { font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: #999; display: block; margin-bottom: 2px; }
  .meta-item .val  { font-size: 16px; font-weight: 700; color: #1a1a1a; }
  .vehicle-name { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
  .vin { font-family: 'Courier New', monospace; font-size: 12px; color: #666; }
  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
function render(data) {
  var app = document.getElementById('app');
  if (!app) return;

  function page(content) { return '<div class="page">' + content + '</div>'; }

  // Every value below originates off-device — the adapter (STI/ATDP banners,
  // DTC codes, module names), the CarsXE API, or user-entered vehicle notes —
  // and lands in innerHTML. Escape it all; quotes too, since some values are
  // interpolated into attributes.
  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function fmtV(v) {
    if (!v || v <= 0) return '<span class="mono">&#8212;</span>';
    var cls = v < 12.0 ? 'crit' : v < 12.4 ? 'warn' : 'ok';
    return '<span class="mono ' + cls + '">' + (+v).toFixed(3) + ' V</span>';
  }

  var v = data.vehicle || {};
  var vehicleName = [v.year, v.make, v.model].filter(Boolean).join(' ') || v.nickname || 'Vehicle';
  var activeDTCs  = (data.dtcs || []).filter(function(d) { return d.status === 'active'; }).length;

  // -- Page 1: Cover ---------------------------------------------------------

  var cover = page([
    '<h1>Diagnostic Report</h1>',
    '<div class="vehicle-name">' + esc(vehicleName) + (v.engine ? ' &middot; ' + esc(v.engine) : '') + '</div>',
    v.vin ? '<div class="vin">' + esc(v.vin) + '</div>' : '',
    '<div class="meta-grid">',
      '<div class="meta-item"><label>Report Date</label><div class="val" style="font-size:13px">' + fmtDate(data.reportDate) + '</div></div>',
      '<div class="meta-item"><label>Battery</label><div class="val">' + fmtV(data.batteryVoltage) + '</div></div>',
      '<div class="meta-item"><label>Check Engine</label><div class="val ' + (data.milOn ? 'crit' : 'ok') + '">' + (data.milOn ? 'ON' : 'OFF') + '</div></div>',
      '<div class="meta-item"><label>Active DTCs</label><div class="val ' + (activeDTCs > 0 ? 'crit' : 'ok') + '">' + activeDTCs + '</div></div>',
      data.adapterInfo ? '<div class="meta-item"><label>Adapter</label><div class="val" style="font-size:13px">' + esc(data.adapterInfo) + '</div></div>' : '',
      data.protocol    ? '<div class="meta-item"><label>Protocol</label><div class="val" style="font-size:13px">' + esc(data.protocol)  + '</div></div>' : '',
      data.appVersion  ? '<div class="meta-item"><label>App Version</label><div class="val" style="font-size:13px">' + esc(data.appVersion) + '</div></div>' : '',
    '</div>',
    v.notes ? '<p style="margin-top:16px;font-size:11px;color:#666">' + esc(v.notes) + '</p>' : '',
  ].join(''));

  // -- Page 2: Fault codes ---------------------------------------------------

  var dtcRows = (data.dtcs || []).length === 0
    ? '<tr><td colspan="5" style="color:#999;text-align:center;padding:16px">No DTCs stored</td></tr>'
    : (data.dtcs || []).map(function(d) {
        var cls = d.status === 'active' ? 'crit' : d.status === 'pending' ? 'warn' : '';
        return '<tr><td class="mono ' + cls + '">' + esc(d.code) + '</td><td>' + (d.module ? esc(d.module) : '&#8212;') + '</td><td class="' + cls + '">' + (d.status ? esc(d.status) : '&#8212;') + '</td><td>' + esc(d.description || '') + '</td></tr>';
      }).join('');

  var modRows = (data.modules || []).length === 0
    ? '<tr><td colspan="3" style="color:#999;text-align:center">No module data</td></tr>'
    : (data.modules || []).map(function(m) {
        var cls = m.status === 'rogue' ? 'crit' : (m.status === 'awake' || m.status === 'active') ? 'warn' : 'ok';
        return '<tr><td>' + ((m.name || m.address) ? esc(m.name || m.address) : '&#8212;') + '</td><td class="mono">' + (m.address ? esc(m.address) : '&#8212;') + '</td><td class="' + cls + '">' + (m.status ? esc(m.status) : '&#8212;') + '</td></tr>';
      }).join('');

  var dtcsPage = page([
    '<h1>Fault Codes</h1>',
    '<table><thead><tr><th>Code</th><th>Module</th><th>Status</th><th>Description</th></tr></thead>',
    '<tbody>' + dtcRows + '</tbody></table>',
    '<h2>Module Status</h2>',
    '<table><thead><tr><th>Module</th><th>Address</th><th>Status</th></tr></thead>',
    '<tbody>' + modRows + '</tbody></table>',
  ].join(''));

  // -- Page 3: Freeze frames -------------------------------------------------

  var ffContent = (data.freezeFrames || []).length === 0
    ? '<p style="color:#999;margin-top:12px">No freeze frames captured in this session.</p>'
    : (data.freezeFrames || []).map(function(ff) {
        var pidRows = Object.keys(ff.liveData || {}).map(function(pid) {
          return '<tr><td class="mono">' + esc(pid) + '</td><td>' + esc(ff.liveData[pid].value) + '</td></tr>';
        }).join('');
        return '<h2>' + esc(ff.dtcCode) + ' &mdash; ' + fmtDate(ff.capturedAt) + '</h2>' +
               '<table><thead><tr><th>PID</th><th>Value at Fault</th></tr></thead><tbody>' + pidRows + '</tbody></table>';
      }).join('');

  var ffPage = page('<h1>Freeze Frames</h1>' + ffContent);

  // -- Page 4: Voltage timeline ----------------------------------------------

  var W = 520; var H = 90;
  var V_MIN = 11.4; var V_MAX = 13.2;
  function yOf(val) { return H - ((val - V_MIN) / (V_MAX - V_MIN)) * H; }

  var hist = data.voltageHistory || [];
  var pts  = hist.length > 1
    ? hist.map(function(val, i) { return ((i / (hist.length - 1)) * W).toFixed(1) + ',' + yOf(val).toFixed(1); }).join(' ')
    : '';
  var lastV = hist[hist.length - 1] || 0;
  var lineColor = lastV < 12.0 ? '#BF360C' : lastV < 12.4 ? '#E65100' : '#00A152';

  var refs = [{ v: 12.6, c: '#00A152' }, { v: 12.4, c: '#E65100' }, { v: 12.0, c: '#BF360C' }];
  var refLines = refs.map(function(r) {
    return '<line x1="0" y1="' + yOf(r.v).toFixed(1) + '" x2="' + W + '" y2="' + yOf(r.v).toFixed(1) +
           '" stroke="' + r.c + '" stroke-width="0.6" stroke-dasharray="3,2"/>' +
           '<text x="' + (W + 4) + '" y="' + (yOf(r.v) + 4).toFixed(1) + '" font-size="8" fill="' + r.c + '">' + r.v + 'V</text>';
  }).join('');

  var svgChart = pts
    ? '<svg viewBox="-5 -5 ' + (W + 70) + ' ' + (H + 15) + '" style="width:100%;max-height:130px;overflow:visible;margin-top:10px">' +
      refLines +
      '<polyline points="' + pts + '" fill="none" stroke="' + lineColor + '" stroke-width="2"/>' +
      '<circle cx="' + W + '" cy="' + yOf(lastV).toFixed(1) + '" r="4" fill="' + lineColor + '"/>' +
      '</svg>' +
      '<p style="font-size:10px;color:#666;font-family:monospace;margin-top:4px">' +
      hist.length + ' samples &middot; Last: ' + (+lastV).toFixed(3) + ' V</p>'
    : '<p style="color:#999;margin-top:12px">No voltage history in this session.</p>';

  var voltPage = page('<h1>Voltage Timeline</h1>' + svgChart);

  // -- Page 5: Parasitic draw checklist -------------------------------------

  var checkRows = (data.checklist || []).length === 0
    ? '<tr><td colspan="3" style="color:#999;text-align:center">No checklist data</td></tr>'
    : (data.checklist || []).map(function(item, i) {
        var hasPassed = item.passed !== undefined && item.passed !== null;
        var resultCls = !hasPassed ? '' : item.passed ? 'ok' : 'crit';
        var result    = !hasPassed ? '&#8212;' : item.passed ? 'Pass' : 'Fail';
        return '<tr><td style="width:30px;color:#999">' + (i + 1) + '</td>' +
               '<td>' + esc(item.description || item.label || '') + '</td>' +
               '<td class="' + resultCls + '">' + result + '</td>' +
               '<td style="color:#666;font-size:10px">' + esc(item.notes || '') + '</td></tr>';
      }).join('');

  var checkPage = page([
    '<h1>Parasitic Draw Protocol</h1>',
    '<table><thead><tr><th>#</th><th>Step</th><th>Result</th><th>Notes</th></tr></thead>',
    '<tbody>' + checkRows + '</tbody></table>',
  ].join(''));

  // -- Page 6: Session log ---------------------------------------------------

  var filteredLog = (data.log || []).filter(function(e) { return e.level === 'error' || e.level === 'warn'; }).slice(-100);
  var logRows = filteredLog.length === 0
    ? '<tr><td colspan="3" style="color:#999;text-align:center">No errors or warnings logged</td></tr>'
    : filteredLog.map(function(e) {
        var cls = e.level === 'error' ? 'crit' : 'warn';
        return '<tr><td class="mono" style="white-space:nowrap;font-size:10px">' +
               new Date(e.timestamp).toLocaleTimeString() + '</td>' +
               '<td class="' + cls + '">' + esc(String(e.level || '').toUpperCase()) + '</td>' +
               '<td style="font-size:10px">' + esc(e.message || '') + '</td></tr>';
      }).join('');

  var logPage = page([
    '<h1>Session Log</h1>',
    '<p style="font-size:10px;color:#666;margin-bottom:8px">Errors and warnings only &middot; last 100 entries</p>',
    '<table><thead><tr><th>Time</th><th>Level</th><th>Message</th></tr></thead>',
    '<tbody>' + logRows + '</tbody></table>',
  ].join(''));

  app.innerHTML = cover + dtcsPage + ffPage + voltPage + checkPage + logPage;
}

if (typeof window !== 'undefined' && window.__REPORT_DATA__) {
  render(window.__REPORT_DATA__);
}
</script>
</body>
</html>
